# Instalación por separado. Dentro de REPEAT-ONE se usa el docker-compose.yml de REPEAT-ONE.
services:
  lastfm-scrobbles:
    build: .
    container_name: lastfm-scrobbles
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - LASTFM_DB=/data/lastfm_stats.db
      - LASTFM_JSON=/data/lastfm_stats.json
      - LASTFM_DETAIL_JSON=/data/lastfm_detail.json
    volumes:
      - ${DATOS:-./datos}:/data
    # Solo para lanzar la sincronización a mano (POST /api/jobs/run); quítalo si no lo usas
    ports:
      - "127.0.0.1:${PUERTO:-8797}:5000"
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "lastfm_scrobbles"
      ofelia.job-exec.lastfm-scrobbles-daily.schedule: "0 0 0 * * *"
      ofelia.job-exec.lastfm-scrobbles-daily.command: "nice -n 19 ionice -c 3 python3 extraer_scrobbles.py"

  # Ofelia lanza los trabajos programados de las etiquetas ofelia.job-exec.* de arriba
  # (los mismos horarios que en REPEAT-ONE). Solo ve los contenedores de este repo.
  # Si no quieres actualizaciones automáticas: docker compose stop ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker --docker-filter=label=repeat-one.ofelia=lastfm_scrobbles
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - lastfm-scrobbles
